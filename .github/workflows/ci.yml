name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -timeout 120s ./...

      - name: Build
        run: go build ./...

      - name: Installers
        run: bash tests/install/test.sh

      - name: Container profile
        if: runner.os == 'Linux'
        run: |
          docker build -t cody-ci .
          docker run --rm cody-ci version
          # The mounted project is writable and the image is not.
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/workspace" --entrypoint bash cody-ci \
            -c 'touch /workspace/.ci-probe && ! touch /usr/local/bin/probe'
          rm -f .ci-probe

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Browser regressions
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Native macOS app
        if: runner.os == 'macOS'
        run: make macapp
