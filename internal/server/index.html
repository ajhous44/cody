<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cody</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #11151f;
    --panel-2: #161b28;
    --line: #232a3a;
    --text: #d7dde8;
    --dim: #7b8699;
    --cyan: #4cc9f0;
    --yellow: #ffd166;
    --red: #ef476f;
    --green: #57cc99;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 var(--mono);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .brand svg { display: block; }
  .brand .v { color: var(--dim); font-weight: 400; }
  .grow { flex: 1; }
  header label { color: var(--dim); display: flex; align-items: center; gap: 6px; }
  input, select, textarea {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    font: inherit;
    padding: 5px 8px;
    outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--cyan); }
  #model { width: 220px; }
  #status { display: flex; align-items: center; gap: 8px; color: var(--dim); }
  #status .face { color: var(--cyan); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3b4354; }
  .dot.busy { background: var(--cyan); animation: pulse 1s ease-in-out infinite; }
  .dot.error { background: var(--red); }
  @keyframes pulse { 50% { opacity: .35; } }

  main { flex: 1; overflow-y: auto; padding: 18px 16px 8px; scroll-behavior: smooth; }
  .wrap { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .user {
    border-left: 3px solid var(--cyan);
    background: var(--panel);
    padding: 8px 12px;
    border-radius: 0 8px 8px 0;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .assistant { white-space: pre-wrap; word-break: break-word; }
  .system { color: var(--dim); font-style: italic; }
  .error { color: var(--red); }

  .tool {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    overflow: hidden;
  }
  .tool-head {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; cursor: pointer;
  }
  .tool-name { color: var(--cyan); }
  .tool-summary { flex: 1; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool-ms { color: var(--dim); font-size: 12px; }
  .tool-body {
    margin: 0; padding: 10px; border-top: 1px solid var(--line);
    color: var(--dim); white-space: pre-wrap; word-break: break-word;
    max-height: 0; overflow: hidden; transition: max-height .15s ease;
  }
  .tool.open .tool-body { max-height: 320px; overflow: auto; }
  .tool.fail .tool-name { color: var(--red); }
  .tool.fail .tool-ms::after { content: " · failed"; color: var(--red); }

  .approval {
    border: 1px solid var(--yellow);
    border-radius: 8px;
    background: color-mix(in srgb, var(--yellow) 8%, var(--bg));
    padding: 10px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .approval .title { color: var(--yellow); }
  .approval pre { margin: 0; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .approval .actions { display: flex; gap: 8px; }
  .approval button { font: inherit; padding: 5px 14px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; background: var(--panel-2); color: var(--text); }
  .approval button.allow { border-color: var(--green); color: var(--green); }
  .approval button.deny { border-color: var(--red); color: var(--red); }
  .approval button:disabled { opacity: .5; cursor: default; }

  details.reasoning { color: var(--dim); }
  details.reasoning summary { cursor: pointer; }
  details.reasoning pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; }

  footer {
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 10px 16px 12px;
  }
  .composer { max-width: 900px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  #input { flex: 1; resize: none; min-height: 40px; max-height: 180px; line-height: 1.45; }
  button.primary, button.ghost {
    font: inherit; padding: 9px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
  }
  button.primary { border-color: var(--cyan); color: var(--cyan); }
  button.ghost { color: var(--dim); }
  button:disabled { opacity: .45; cursor: default; }
  .meta { max-width: 900px; margin: 8px auto 0; color: var(--dim); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  .meta .spacer { flex: 1; }

  .banner {
    max-width: 900px; margin: 14px auto 0; padding: 10px 12px;
    border: 1px solid var(--red); border-radius: 8px; color: var(--red);
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
      <rect x="6.5" y="1.5" width="9" height="3" rx="1.5" fill="#4cc9f0"/>
      <rect x="2.5" y="4.5" width="17" height="13" rx="3" fill="none" stroke="#4cc9f0" stroke-width="1.6"/>
      <circle cx="8" cy="10" r="1.5" fill="#4cc9f0"/>
      <circle cx="14" cy="10" r="1.5" fill="#4cc9f0"/>
      <rect x="8" y="13.5" width="6" height="1.5" rx=".75" fill="#4cc9f0"/>
      <rect x="6" y="17.5" width="3.5" height="3" rx="1" fill="#4cc9f0"/>
      <rect x="12.5" y="17.5" width="3.5" height="3" rx="1" fill="#4cc9f0"/>
    </svg>
    <span>cody</span>
  </div>
  <label>model <input id="model" spellcheck="false" autocomplete="off"></label>
  <label>approval
    <select id="approval">
      <option value="ask">ask</option>
      <option value="auto">auto</option>
      <option value="yolo">yolo</option>
    </select>
  </label>
  <div class="grow"></div>
  <div id="status"><span class="dot" id="dot"></span><span class="face" id="face"></span><span id="statustext">connecting…</span></div>
</header>

<main id="main"><div class="wrap" id="transcript"></div></main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask cody to change code… (enter sends, shift+enter newline)"></textarea>
    <button class="primary" id="send">send</button>
    <button class="ghost" id="stop" hidden>stop</button>
  </div>
  <div class="meta">
    <span id="workspace"></span>
    <span id="session"></span>
    <span class="spacer"></span>
    <span id="tokens"></span>
  </div>
</footer>

<script>
(() => {
  const faces = ["[ ●  ● ]","[ ●  ● ]","[●  ●  ]","[●  ●  ]","[●  ●  ]","[-  -  ]","[ ●  ● ]","[ ●  ● ]",
                 "[  ●  ●]","[  ●  ●]","[  ●  ●]","[  -  -]","[ ●  ● ]","[ -  - ]","[ ●  ● ]","[ -  - ]"];
  const params = new URLSearchParams(location.search);
  let token = params.get("token") || sessionStorage.getItem("cody-token") || "";
  if (token) sessionStorage.setItem("cody-token", token);

  const $ = (id) => document.getElementById(id);
  const transcript = $("transcript");
  const main = $("main");
  const input = $("input");
  const sendBtn = $("send");
  const stopBtn = $("stop");
  const dot = $("dot");
  const face = $("face");
  const statusText = $("statustext");

  let busy = false;
  let needHistory = true;
  let assistantEl = null;
  let toolEl = null;
  let reasoningEl = null;
  let spinner = null;
  let spinnerFrame = 0;
  let usage = null;

  if (!token) {
    const b = document.createElement("div");
    b.className = "banner";
    b.textContent = "Missing access token. Open the URL printed in your terminal (it includes ?token=…).";
    $("main").prepend(b);
  }

  function api(path, body) {
    return fetch(path + "?token=" + encodeURIComponent(token), {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Cody-Token": token },
      body: JSON.stringify(body || {}),
    }).then(async (r) => {
      if (!r.ok) throw new Error((await r.text()).trim() || r.statusText);
      return r.json().catch(() => ({}));
    });
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    transcript.appendChild(n);
    scroll();
    return n;
  }

  function scroll() { main.scrollTop = main.scrollHeight; }

  function resetTurn() { assistantEl = null; toolEl = null; reasoningEl = null; }

  function setBusy(v) {
    busy = v;
    sendBtn.disabled = v;
    stopBtn.hidden = !v;
    dot.className = "dot" + (v ? " busy" : "");
    if (v) startSpinner(); else stopSpinner();
  }

  function startSpinner() {
    if (spinner) return;
    face.textContent = faces[0];
    statusText.textContent = "thinking…";
    spinner = setInterval(() => {
      spinnerFrame = (spinnerFrame + 1) % faces.length;
      face.textContent = faces[spinnerFrame];
    }, 120);
  }

  function stopSpinner() {
    if (spinner) { clearInterval(spinner); spinner = null; }
    face.textContent = "";
    statusText.textContent = "ready";
  }

  function userMessage(text) { resetTurn(); el("div", "user", text); scroll(); }

  function assistantChunk(text) {
    if (!assistantEl) assistantEl = el("div", "assistant");
    assistantEl.textContent += text;
    scroll();
  }

  function reasoningChunk(text) {
    if (!reasoningEl) {
      reasoningEl = document.createElement("details");
      reasoningEl.className = "reasoning";
      const s = document.createElement("summary");
      s.textContent = "reasoning";
      const pre = document.createElement("pre");
      reasoningEl.append(s, pre);
      transcript.appendChild(reasoningEl);
    }
    reasoningEl.querySelector("pre").textContent += text;
    scroll();
  }

  function toolCard(name, summary) {
    const card = document.createElement("div");
    card.className = "tool";
    const head = document.createElement("div");
    head.className = "tool-head";
    const n = document.createElement("span"); n.className = "tool-name"; n.textContent = name;
    const s = document.createElement("span"); s.className = "tool-summary"; s.textContent = summary || "";
    const ms = document.createElement("span"); ms.className = "tool-ms"; ms.textContent = "running…";
    head.append(n, s, ms);
    const body = document.createElement("pre"); body.className = "tool-body";
    card.append(head, body);
    head.addEventListener("click", () => card.classList.toggle("open"));
    transcript.appendChild(card);
    scroll();
    toolEl = card;
  }

  function toolResult(result, ms) {
    if (!toolEl) return;
    const isFail = result.startsWith("error:") || result.startsWith("user denied");
    if (isFail) toolEl.classList.add("fail");
    toolEl.querySelector(".tool-ms").textContent = ms + "ms";
    toolEl.querySelector(".tool-body").textContent = (result || "(no output)").trim();
    scroll();
  }

  function approvalCard(id, tool, summary, args) {
    const card = document.createElement("div");
    card.className = "approval";
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = "approve " + tool;
    const detail = document.createElement("pre");
    detail.textContent = summary || args;
    const actions = document.createElement("div");
    actions.className = "actions";
    const allow = document.createElement("button");
    allow.className = "allow"; allow.textContent = "approve";
    const deny = document.createElement("button");
    deny.className = "deny"; deny.textContent = "deny";
    actions.append(allow, deny);
    card.append(title, detail, actions);
    transcript.appendChild(card);
    scroll();
    const decide = async (ok) => {
      allow.disabled = deny.disabled = true;
      try {
        await api("/api/approve", { id, allow: ok });
        title.textContent = (ok ? "approved " : "denied ") + tool;
      } catch (e) {
        title.textContent = "approval failed: " + e.message;
      }
    };
    allow.addEventListener("click", () => decide(true));
    deny.addEventListener("click", () => decide(false));
  }

  function notice(text) { el("div", "system", text); }
  function errorLine(text) { el("div", "error", text); }

  function renderHistory(items) {
    transcript.textContent = "";
    resetTurn();
    for (const m of items || []) {
      if (m.role === "user") {
        el("div", "user", m.text || "");
      } else if (m.role === "assistant") {
        if (m.text) el("div", "assistant", m.text);
        for (const t of m.tools || []) {
          const card = document.createElement("div");
          card.className = "tool";
          card.dataset.toolId = t.id;
          const head = document.createElement("div");
          head.className = "tool-head";
          head.innerHTML = '<span class="tool-name"></span><span class="tool-summary"></span><span class="tool-ms">ok</span>';
          head.querySelector(".tool-name").textContent = t.name;
          head.querySelector(".tool-summary").textContent = t.args || "";
          const body = document.createElement("pre");
          body.className = "tool-body";
          card.append(head, body);
          head.addEventListener("click", () => card.classList.toggle("open"));
          transcript.appendChild(card);
        }
      } else if (m.role === "tool") {
        const card = transcript.querySelector('[data-tool-id="' + CSS.escape(m.tool_call_id || "") + '"]');
        if (card) {
          card.querySelector(".tool-body").textContent = (m.text || "").trim();
          if ((m.text || "").startsWith("error:")) card.classList.add("fail");
        }
      }
    }
    scroll();
  }

  function applyState(s) {
    if (s.model && document.activeElement !== $("model")) $("model").value = s.model;
    if (s.approval) $("approval").value = s.approval;
    $("workspace").textContent = s.workspace || "";
    $("session").textContent = s.session ? "session " + s.session : "";
    setBusy(!!s.busy);
    if (needHistory) {
      renderHistory(s.history);
      needHistory = false;
    }
  }

  function handle(ev) {
    switch (ev.type) {
      case "state": applyState(ev); break;
      case "turn_start": resetTurn(); setBusy(true); break;
      case "thinking": startSpinner(); break;
      case "reasoning": stopSpinner(); reasoningChunk(ev.text || ""); break;
      case "text": stopSpinner(); assistantChunk(ev.text || ""); break;
      case "tool_start": stopSpinner(); toolCard(ev.tool, ev.summary || ev.args); break;
      case "tool_end": toolResult(ev.result || "", ev.ms || 0); break;
      case "approval": approvalCard(ev.id, ev.tool, ev.summary, ev.args); break;
      case "notice": notice(ev.text || ""); break;
      case "usage":
        usage = ev.usage;
        if (usage) $("tokens").textContent = "tokens " + usage.prompt_tokens + " in / " + usage.completion_tokens + " out";
        break;
      case "turn_end":
        setBusy(false);
        if (ev.error) errorLine("cody: " + ev.error);
        resetTurn();
        break;
      case "turn_cancelled": setBusy(false); notice("cancelled"); resetTurn(); break;
    }
  }

  function connect() {
    const es = new EventSource("/api/events?token=" + encodeURIComponent(token));
    es.onopen = () => { needHistory = true; dot.className = "dot" + (busy ? " busy" : ""); };
    es.onmessage = (m) => { try { handle(JSON.parse(m.data)); } catch (e) {} };
    es.onerror = () => {
      dot.className = "dot error";
      statusText.textContent = "reconnecting…";
    };
  }

  async function send() {
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = "";
    autosize();
    userMessage(text);
    setBusy(true);
    try {
      await api("/api/prompt", { text });
    } catch (e) {
      setBusy(false);
      errorLine("cody: " + e.message);
    }
  }

  async function stop() {
    try { await api("/api/interrupt"); } catch (e) {}
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
  }

  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener("click", send);
  stopBtn.addEventListener("click", stop);
  $("model").addEventListener("change", async () => {
    try { await api("/api/model", { model: $("model").value.trim() }); } catch (e) { errorLine("cody: " + e.message); }
  });
  $("approval").addEventListener("change", async () => {
    try { await api("/api/approval", { mode: $("approval").value }); } catch (e) { errorLine("cody: " + e.message); }
  });

  connect();
  input.focus();
})();
</script>
</body>
</html>
